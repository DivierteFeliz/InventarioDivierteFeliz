<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Empresa</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-dark: #1F2937;
            --text-light: #6B7280;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1, h2 {
            color: var(--primary);
            text-align: center;
        }

        /* Sección de Estadísticas */
        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            flex: 1;
            min-width: 200px;
            max-width: 300px;
            border-bottom: 4px solid var(--primary);
        }

        .stat-card.added { border-color: var(--success); }
        .stat-card.removed { border-color: var(--danger); }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0 0 0;
        }

        /* Formulario */
        .form-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        input[type="text"], input[type="number"], input[type="file"] {
            padding: 10px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: opacity 0.3s, transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); margin-top: 15px; width: 100%; font-size: 1.1rem; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .btn-warning { background-color: var(--warning); }

        /* Cuadrícula de Inventario */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #E5E7EB;
        }

        .product-details {
            padding: 15px;
            flex-grow: 1;
        }

        .product-title {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .product-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: var(--text-light);
        }

        .product-price { font-weight: bold; color: var(--success); }

        .product-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
        }
        
        .product-actions .btn {
            font-size: 0.8rem;
            padding: 8px;
        }

        /* Notificación para cuando el inventario está vacío */
        .empty-state {
            text-align: center;
            color: var(--text-light);
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Inventario de Empresa</h1>

    <!-- Estadísticas -->
    <div class="stats-container">
        <div class="stat-card">
            <h3>Total en Inventario</h3>
            <p class="stat-number" id="stat-total">0</p>
            <p style="font-size: 0.8rem; color: var(--text-light);">Unidades totales</p>
        </div>
        <div class="stat-card added">
            <h3>Sumados (Últimos 7 días)</h3>
            <p class="stat-number" id="stat-added" style="color: var(--success);">0</p>
        </div>
        <div class="stat-card removed">
            <h3>Restados (Últimos 7 días)</h3>
            <p class="stat-number" id="stat-removed" style="color: var(--danger);">0</p>
        </div>
    </div>

    <!-- Formulario -->
    <div class="form-container">
        <h2 id="form-title">Agregar Nuevo Producto</h2>
        <form id="product-form">
            <input type="hidden" id="product-id">
            <div class="form-grid">
                <div class="input-group">
                    <label for="nombre">Nombre del Producto</label>
                    <input type="text" id="nombre" required placeholder="Ej. Lámpara LED">
                </div>
                <div class="input-group">
                    <label for="precio">Precio de Venta ($)</label>
                    <input type="number" id="precio" required min="0" step="0.01" placeholder="Ej. 15000">
                </div>
                <div class="input-group">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" required min="1" placeholder="Ej. 10">
                </div>
                <div class="input-group">
                    <label for="foto">Foto del Producto</label>
                    <input type="file" id="foto" accept="image/*">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="btn-submit">Guardar Producto</button>
        </form>
    </div>

    <!-- Cuadrícula de Productos -->
    <div class="inventory-grid" id="inventory-grid">
        <!-- Los productos se inyectarán aquí vía JavaScript -->
    </div>
</div>

<script>
    // Estado de la aplicación usando localStorage
    let inventory = JSON.parse(localStorage.getItem('inventory')) || [];
    let statsLog = JSON.parse(localStorage.getItem('statsLog')) || [];
    
    // Referencias al DOM
    const form = document.getElementById('product-form');
    const grid = document.getElementById('inventory-grid');
    const btnSubmit = document.getElementById('btn-submit');
    const formTitle = document.getElementById('form-title');

    // Inicializar
    renderInventory();
    renderStats();

    // Manejar el envío del formulario (Crear o Editar)
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const id = document.getElementById('product-id').value;
        const nombre = document.getElementById('nombre').value;
        const precio = parseFloat(document.getElementById('precio').value);
        const cantidad = parseInt(document.getElementById('cantidad').value);
        const fotoFile = document.getElementById('foto').files[0];

        if (fotoFile) {
            const reader = new FileReader();
            reader.onload = function(event) {
                saveProduct(id, nombre, precio, cantidad, event.target.result);
            };
            reader.readAsDataURL(fotoFile);
        } else {
            // Si es edición y no se subió foto nueva, mantener la anterior
            const existingProduct = inventory.find(p => p.id == id);
            const fotoData = existingProduct ? existingProduct.foto : 'https://via.placeholder.com/250x200?text=Sin+Imagen';
            saveProduct(id, nombre, precio, cantidad, fotoData);
        }
    });

    function saveProduct(id, nombre, precio, cantidad, foto) {
        if (id) {
            // Modo Edición
            const index = inventory.findIndex(p => p.id == id);
            const diff = cantidad - inventory[index].cantidad;
            if(diff > 0) logStat('add', diff);
            if(diff < 0) logStat('remove', Math.abs(diff));
            
            inventory[index] = { id: parseInt(id), nombre, precio, cantidad, foto };
        } else {
            // Modo Creación
            const newProduct = {
                id: Date.now(),
                nombre,
                precio,
                cantidad,
                foto
            };
            inventory.push(newProduct);
            logStat('add', cantidad);
        }

        updateData();
        form.reset();
        document.getElementById('product-id').value = '';
        btnSubmit.textContent = 'Guardar Producto';
        btnSubmit.style.backgroundColor = 'var(--primary)';
        formTitle.textContent = 'Agregar Nuevo Producto';
    }

    // Funciones de Acción
    function deleteProduct(id) {
        if(confirm('¿Estás seguro de eliminar este producto?')) {
            const product = inventory.find(p => p.id === id);
            logStat('remove', product.cantidad);
            inventory = inventory.filter(p => p.id !== id);
            updateData();
        }
    }

    function editProduct(id) {
        const product = inventory.find(p => p.id === id);
        document.getElementById('product-id').value = product.id;
        document.getElementById('nombre').value = product.nombre;
        document.getElementById('precio').value = product.precio;
        document.getElementById('cantidad').value = product.cantidad;
        
        btnSubmit.textContent = 'Actualizar Producto';
        btnSubmit.style.backgroundColor = 'var(--warning)';
        formTitle.textContent = 'Modificando: ' + product.nombre;
        window.scrollTo(0, 0);
    }

    function duplicateProduct(id) {
        const product = inventory.find(p => p.id === id);
        const duplicate = {
            ...product,
            id: Date.now(), // Nuevo ID único
            nombre: product.nombre + ' (Copia)'
        };
        inventory.push(duplicate);
        logStat('add', duplicate.cantidad);
        updateData();
    }

    // Estadísticas
    function logStat(type, quantity) {
        statsLog.push({
            type: type,
            quantity: quantity,
            date: new Date().getTime()
        });
        localStorage.setItem('statsLog', JSON.stringify(statsLog));
    }

    function renderStats() {
        const now = new Date().getTime();
        const sevenDaysAgo = now - (7 * 24 * 60 * 60 * 1000);
        
        let totalItems = 0;
        let addedLast7Days = 0;
        let removedLast7Days = 0;

        // Total actual
        inventory.forEach(p => totalItems += p.cantidad);

        // Movimientos últimos 7 días
        statsLog.forEach(log => {
            if (log.date >= sevenDaysAgo) {
                if (log.type === 'add') addedLast7Days += log.quantity;
                if (log.type === 'remove') removedLast7Days += log.quantity;
            }
        });

        document.getElementById('stat-total').textContent = totalItems;
        document.getElementById('stat-added').textContent = addedLast7Days;
        document.getElementById('stat-removed').textContent = removedLast7Days;
    }

    // Renderizar la Interfaz
    function renderInventory() {
        grid.innerHTML = '';
        if (inventory.length === 0) {
            grid.innerHTML = '<div class="empty-state">No hay productos en el inventario. Agrega uno arriba.</div>';
            return;
        }

        inventory.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.foto}" alt="${product.nombre}" class="product-image">
                <div class="product-details">
                    <h3 class="product-title">${product.nombre}</h3>
                    <div class="product-info">
                        <span class="product-price">$${product.precio.toLocaleString('es-CL')}</span>
                        <span>Stock: <b>${product.cantidad}</b></span>
                    </div>
                    <div class="product-actions">
                        <button class="btn btn-warning" onclick="editProduct(${product.id})">Editar</button>
                        <button class="btn btn-success" onclick="duplicateProduct(${product.id})">Duplicar</button>
                        <button class="btn btn-danger" onclick="deleteProduct(${product.id})">Borrar</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Actualizar almacenamiento y vista
    function updateData() {
        localStorage.setItem('inventory', JSON.stringify(inventory));
        renderInventory();
        renderStats();
    }
</script>

</body>
</html>
