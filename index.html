<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Colaborativo</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-dark: #1F2937;
            --text-light: #6B7280;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1, h2 { color: var(--primary); text-align: center; }

        #connection-status {
            text-align: center;
            padding: 10px;
            background-color: var(--warning);
            color: white;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Estadísticas */
        .stats-container { display: flex; gap: 20px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; flex: 1; min-width: 200px; border-bottom: 4px solid var(--primary); }
        .stat-card.added { border-color: var(--success); }
        .stat-card.removed { border-color: var(--danger); }
        .stat-number { font-size: 2rem; font-weight: bold; margin: 10px 0 0 0; }

        /* Formulario */
        .form-container { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .input-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: var(--text-dark); }
        input[type="text"], input[type="number"], input[type="file"] { padding: 10px; border: 1px solid #D1D5DB; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--primary); }
        
        .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); margin-top: 15px; width: 100%; font-size: 1.1rem; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .btn-warning { background-color: var(--warning); }

        /* Cuadrícula */
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .product-image { width: 100%; height: 200px; object-fit: cover; background-color: #E5E7EB; }
        .product-details { padding: 15px; flex-grow: 1; }
        .product-title { margin: 0 0 10px 0; font-size: 1.2rem; color: var(--primary); }
        .product-info { display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--text-light); }
        .product-price { font-weight: bold; color: var(--success); }
        .product-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
        .product-actions .btn { font-size: 0.8rem; padding: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Inventario Colaborativo</h1>
    
    <div id="connection-status">Sincronizando con la nube...</div>

    <!-- Estadísticas -->
    <div class="stats-container">
        <div class="stat-card">
            <h3>Total en Inventario</h3>
            <p class="stat-number" id="stat-total">0</p>
            <p style="font-size: 0.8rem; color: var(--text-light);">Unidades totales</p>
        </div>
        <div class="stat-card added">
            <h3>Movimientos Recientes</h3>
            <p class="stat-number" id="stat-added" style="color: var(--success);">Últimos 7 días</p>
            <p style="font-size: 0.8rem; color: var(--text-light);">Revisa consola para detalle</p>
        </div>
    </div>

    <!-- Formulario -->
    <div class="form-container">
        <h2 id="form-title">Agregar Nuevo Producto</h2>
        <form id="product-form">
            <input type="hidden" id="product-id">
            <div class="form-grid">
                <div class="input-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="input-group">
                    <label>Precio de Venta ($)</label>
                    <input type="number" id="precio" required min="0" step="0.01">
                </div>
                <div class="input-group">
                    <label>Cantidad</label>
                    <input type="number" id="cantidad" required min="1">
                </div>
                <div class="input-group">
                    <label>Foto del Producto</label>
                    <input type="file" id="foto" accept="image/*">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="btn-submit">Guardar Producto</button>
            <button type="button" class="btn btn-warning" id="btn-cancel" style="display:none; width: 100%; margin-top: 10px;">Cancelar Edición</button>
        </form>
    </div>

    <!-- Cuadrícula -->
    <div class="inventory-grid" id="inventory-grid"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // =========================================================================
    // ⚠️ REEMPLAZA ESTO CON LOS DATOS DE TU PROYECTO FIREBASE (Paso 6) ⚠️
    // =========================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyBWsaW2Hh6d7EJwTjGGPvj_Ez2pXyDHETY",
        authDomain: "inventariodiviertefeliz.firebaseapp.com",
        projectId: "inventariodiviertefeliz",
        storageBucket: "inventariodiviertefeliz.firebasestorage.app",
        messagingSenderId: "751240098013",
        appId: "1:751240098013:web:ed5af24a2008eff0b6ab34"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const inventarioRef = collection(db, "productos");

    // Referencias del DOM
    const form = document.getElementById('product-form');
    const grid = document.getElementById('inventory-grid');
    const statusDiv = document.getElementById('connection-status');
    const btnCancel = document.getElementById('btn-cancel');

    let currentProducts = [];

    // Escuchar cambios en tiempo real
    onSnapshot(inventarioRef, (snapshot) => {
        statusDiv.style.backgroundColor = 'var(--success)';
        statusDiv.textContent = '🟢 Conectado y Sincronizado en Tiempo Real';
        
        currentProducts = [];
        let totalItems = 0;
        grid.innerHTML = '';

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;
            currentProducts.push({ id, ...data });
            totalItems += data.cantidad;

            // Renderizar producto
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${data.foto || 'https://via.placeholder.com/250x200?text=Sin+Imagen'}" class="product-image">
                <div class="product-details">
                    <h3 class="product-title">${data.nombre}</h3>
                    <div class="product-info">
                        <span class="product-price">$${data.precio.toLocaleString('es-CL')}</span>
                        <span>Stock: <b>${data.cantidad}</b></span>
                    </div>
                    <div class="product-actions">
                        <button class="btn btn-warning btn-edit" data-id="${id}">Editar</button>
                        <button class="btn btn-success btn-dup" data-id="${id}">Duplicar</button>
                        <button class="btn btn-danger btn-del" data-id="${id}">Borrar</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });

        document.getElementById('stat-total').textContent = totalItems;
        asignarEventosBotones();
    });

    // Redimensionar imagen para evitar saturar la base de datos
    function procesarImagen(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400;
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            }
            img.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }

    // Enviar Formulario (Crear / Actualizar)
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusDiv.style.backgroundColor = 'var(--warning)';
        statusDiv.textContent = 'Guardando en la nube...';

        const id = document.getElementById('product-id').value;
        const nombre = document.getElementById('nombre').value;
        const precio = parseFloat(document.getElementById('precio').value);
        const cantidad = parseInt(document.getElementById('cantidad').value);
        const fotoFile = document.getElementById('foto').files[0];

        const guardarDatos = async (fotoData) => {
            const productoData = { nombre, precio, cantidad, fecha: serverTimestamp() };
            if (fotoData) productoData.foto = fotoData;

            try {
                if (id) {
                    await updateDoc(doc(db, "productos", id), productoData);
                } else {
                    await addDoc(inventarioRef, productoData);
                }
                form.reset();
                resetFormState();
            } catch (error) {
                alert("Error al guardar: " + error.message);
            }
        };

        if (fotoFile) {
            procesarImagen(fotoFile, guardarDatos);
        } else {
            guardarDatos(null);
        }
    });

    // Asignar eventos a botones generados dinámicamente
    function asignarEventosBotones() {
        document.querySelectorAll('.btn-del').forEach(btn => {
            btn.onclick = async (e) => {
                if(confirm('¿Eliminar producto?')) {
                    await deleteDoc(doc(db, "productos", e.target.dataset.id));
                }
            };
        });

        document.querySelectorAll('.btn-edit').forEach(btn => {
            btn.onclick = (e) => {
                const id = e.target.dataset.id;
                const prod = currentProducts.find(p => p.id === id);
                document.getElementById('product-id').value = id;
                document.getElementById('nombre').value = prod.nombre;
                document.getElementById('precio').value = prod.precio;
                document.getElementById('cantidad').value = prod.cantidad;
                
                document.getElementById('btn-submit').textContent = 'Actualizar Producto';
                document.getElementById('form-title').textContent = 'Modificando: ' + prod.nombre;
                btnCancel.style.display = 'block';
                window.scrollTo(0, 0);
            };
        });

        document.querySelectorAll('.btn-dup').forEach(btn => {
            btn.onclick = async (e) => {
                const id = e.target.dataset.id;
                const prod = currentProducts.find(p => p.id === id);
                await addDoc(inventarioRef, {
                    nombre: prod.nombre + ' (Copia)',
                    precio: prod.precio,
                    cantidad: prod.cantidad,
                    foto: prod.foto,
                    fecha: serverTimestamp()
                });
            };
        });
    }

    // Cancelar edición
    btnCancel.onclick = resetFormState;

    function resetFormState() {
        document.getElementById('product-id').value = '';
        document.getElementById('btn-submit').textContent = 'Guardar Producto';
        document.getElementById('form-title').textContent = 'Agregar Nuevo Producto';
        btnCancel.style.display = 'none';
        form.reset();
    }
</script>
</body>
</html>
