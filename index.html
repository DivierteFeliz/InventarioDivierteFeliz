<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Colaborativo</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-dark: #1F2937;
            --text-light: #6B7280;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1, h2 { color: var(--primary); text-align: center; }

        #connection-status {
            text-align: center;
            padding: 10px;
            background-color: var(--warning);
            color: white;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Última actualización */
        .update-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 4px solid var(--primary);
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .update-container h3 { margin: 0 0 10px 0; font-size: 1.2rem; color: var(--text-dark); }
        #last-update-time { font-size: 1.8rem; font-weight: bold; color: var(--primary); margin: 0; }

        /* Controles Superiores (Ordenar y Editar) */
        .top-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-group label { margin: 0; font-weight: bold; }
        .control-group select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #D1D5DB;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Formulario */
        .form-container { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .input-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: var(--text-dark); }
        input[type="text"], input[type="number"], input[type="file"] { padding: 10px; border: 1px solid #D1D5DB; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--primary); }
        
        .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); margin-top: 15px; width: 100%; font-size: 1.1rem; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .btn-warning { background-color: var(--warning); }
        
        .form-actions-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .form-actions-grid.editing {
            grid-template-columns: 1fr 1fr 1fr;
        }

        /* Cuadrícula */
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .product-image { width: 100%; height: 200px; object-fit: cover; background-color: #E5E7EB; }
        .product-details { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-title { margin: 0 0 10px 0; font-size: 1.2rem; color: var(--primary); }
        .product-info { display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--text-light); }
        .product-price { font-weight: bold; color: var(--success); }
        
        .product-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
        .product-actions .btn { font-size: 0.9rem; padding: 10px; }
        
        /* Estilo para stock cero */
        .stock-zero { color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Inventario Colaborativo</h1>
    
    <div id="connection-status">Sincronizando con la nube...</div>

    <!-- Última actualización -->
    <div class="update-container">
        <h3>Última Modificación (Base de Datos)</h3>
        <p id="last-update-time">--:--</p>
    </div>

    <!-- Controles Superiores -->
    <div class="top-controls">
        <div class="control-group">
            <label for="sort-select">Ordenar por:</label>
            <select id="sort-select">
                <option value="default">Seleccionar...</option>
                <option value="precio">Precio (Agotados al final)</option>
                <option value="stock-asc">Stock: Menor a Mayor</option>
                <option value="stock-desc">Stock: Mayor a Menor</option>
            </select>
        </div>
        <div class="control-group">
            <label for="edit-select" style="color: var(--warning);">✏️ Editar Producto:</label>
            <select id="edit-select">
                <option value="">-- Seleccionar producto para editar --</option>
                <!-- Las opciones se inyectan por JS -->
            </select>
        </div>
    </div>

    <!-- Formulario -->
    <div class="form-container">
        <h2 id="form-title">Agregar Nuevo Producto</h2>
        <form id="product-form">
            <input type="hidden" id="product-id">
            <div class="form-grid">
                <div class="input-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="input-group">
                    <label>Precio de Venta ($)</label>
                    <input type="number" id="precio" required min="0" step="0.01">
                </div>
                <div class="input-group">
                    <label>Cantidad Inicial</label>
                    <input type="number" id="cantidad" required min="0">
                </div>
                <div class="input-group">
                    <label>Foto del Producto (Opcional si editas)</label>
                    <input type="file" id="foto" accept="image/*">
                </div>
            </div>
            
            <div class="form-actions-grid" id="form-actions-container">
                <button type="submit" class="btn btn-primary" id="btn-submit">Guardar Producto</button>
                <button type="button" class="btn btn-warning" id="btn-cancel" style="display:none;">Cancelar Edición</button>
                <button type="button" class="btn btn-danger" id="btn-delete" style="display:none;">Borrar Producto</button>
            </div>
        </form>
    </div>

    <!-- Cuadrícula -->
    <div class="inventory-grid" id="inventory-grid"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBKkGH0Lna3ioSvkhbbSswXqTwxlfl3Usk",
        authDomain: "inventariodiviertefeliz-81f07.firebaseapp.com",
        projectId: "inventariodiviertefeliz-81f07",
        storageBucket: "inventariodiviertefeliz-81f07.firebasestorage.app",
        messagingSenderId: "133792051761",
        appId: "1:133792051761:web:766bdd9c6f8ddb56f01b10"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const inventarioRef = collection(db, "productos");

    // Referencias del DOM
    const form = document.getElementById('product-form');
    const grid = document.getElementById('inventory-grid');
    const statusDiv = document.getElementById('connection-status');
    const sortSelect = document.getElementById('sort-select');
    const editSelect = document.getElementById('edit-select');
    
    // Botones del formulario
    const btnSubmit = document.getElementById('btn-submit');
    const btnCancel = document.getElementById('btn-cancel');
    const btnDelete = document.getElementById('btn-delete');
    const formActionsContainer = document.getElementById('form-actions-container');

    let currentProducts = [];
    let currentSort = 'default';

    // Ordenamiento
    sortSelect.addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderInventory();
    });

    // Selección de edición
    editSelect.addEventListener('change', (e) => {
        const id = e.target.value;
        if (id) {
            iniciarEdicion(id);
        } else {
            resetFormState();
        }
    });

    // Rellenar selector de edición
    function actualizarSelectorEdicion() {
        // Guardamos el valor actual para no perder la selección al actualizar Firebase
        const currentValue = editSelect.value;
        
        editSelect.innerHTML = '<option value="">-- Seleccionar producto para editar --</option>';
        
        // Ordenamos alfabéticamente solo para la lista desplegable
        const listForSelect = [...currentProducts].sort((a, b) => a.nombre.localeCompare(b.nombre));
        
        listForSelect.forEach(prod => {
            const option = document.createElement('option');
            option.value = prod.id;
            option.textContent = prod.nombre;
            editSelect.appendChild(option);
        });

        // Restaurar selección si existe
        if (currentProducts.find(p => p.id === currentValue)) {
            editSelect.value = currentValue;
        } else {
            resetFormState(); // Si el producto fue borrado, limpiar formulario
        }
    }

    function iniciarEdicion(id) {
        const prod = currentProducts.find(p => p.id === id);
        if (!prod) return;

        document.getElementById('product-id').value = id;
        document.getElementById('nombre').value = prod.nombre;
        document.getElementById('precio').value = prod.precio;
        document.getElementById('cantidad').value = prod.cantidad;
        
        document.getElementById('form-title').textContent = 'Modificando: ' + prod.nombre;
        btnSubmit.textContent = 'Actualizar Cambios';
        btnSubmit.style.backgroundColor = 'var(--warning)';
        
        btnCancel.style.display = 'block';
        btnDelete.style.display = 'block';
        formActionsContainer.classList.add('editing');
        
        // Forzar selector al id correcto (por si se llamó desde otro lado)
        editSelect.value = id; 
    }

    // Dibujar Tarjetas
    function renderInventory() {
        grid.innerHTML = '';
        let sortedProducts = [...currentProducts];

        if (currentSort === 'precio') {
            sortedProducts.sort((a, b) => {
                if (a.cantidad === 0 && b.cantidad !== 0) return 1;
                if (b.cantidad === 0 && a.cantidad !== 0) return -1;
                return a.precio - b.precio; 
            });
        } else if (currentSort === 'stock-asc') {
            sortedProducts.sort((a, b) => a.cantidad - b.cantidad);
        } else if (currentSort === 'stock-desc') {
            sortedProducts.sort((a, b) => b.cantidad - a.cantidad);
        }

        sortedProducts.forEach((data) => {
            const stockDisplay = data.cantidad === 0 
                ? `<b class="stock-zero">Agotado (0)</b>` 
                : `<b>${data.cantidad}</b>`;

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${data.foto || 'https://via.placeholder.com/250x200?text=Sin+Imagen'}" class="product-image">
                <div class="product-details">
                    <h3 class="product-title">${data.nombre}</h3>
                    <div class="product-info">
                        <span class="product-price">$${data.precio.toLocaleString('es-CL')}</span>
                        <span>Stock: ${stockDisplay}</span>
                    </div>
                    <div class="product-actions">
                        <button class="btn btn-danger btn-sold" data-id="${data.id}">- Vendido</button>
                        <button class="btn btn-success btn-add" data-id="${data.id}">+ Agregar</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });

        asignarEventosTarjetas();
    }

    // Escuchar Firebase
    onSnapshot(inventarioRef, (snapshot) => {
        statusDiv.style.backgroundColor = 'var(--success)';
        statusDiv.textContent = '🟢 Conectado y Sincronizado';
        
        currentProducts = [];
        let ultimaFechaNube = null;

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;
            currentProducts.push({ id, ...data });

            // Buscar la fecha más reciente guardada en Firestore
            if (data.fecha) {
                // Convertir el Timestamp de Firebase a milisegundos
                const docTime = data.fecha.toMillis();
                if (!ultimaFechaNube || docTime > ultimaFechaNube) {
                    ultimaFechaNube = docTime;
                }
            }
        });

        // Actualizar reloj solo con la hora de la base de datos
        if (ultimaFechaNube) {
            const fechaReciente = new Date(ultimaFechaNube);
            document.getElementById('last-update-time').textContent = fechaReciente.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        } else {
            document.getElementById('last-update-time').textContent = "Sin datos";
        }

        actualizarSelectorEdicion();
        renderInventory();
    });

    // Procesar Foto
    function procesarImagen(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400;
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            }
            img.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }

    // Enviar Formulario
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusDiv.style.backgroundColor = 'var(--warning)';
        statusDiv.textContent = 'Guardando en la nube...';

        const id = document.getElementById('product-id').value;
        const nombre = document.getElementById('nombre').value;
        const precio = parseFloat(document.getElementById('precio').value);
        const cantidad = parseInt(document.getElementById('cantidad').value);
        const fotoFile = document.getElementById('foto').files[0];

        const guardarDatos = async (fotoData) => {
            const productoData = { nombre, precio, cantidad, fecha: serverTimestamp() };
            if (fotoData) productoData.foto = fotoData;

            try {
                if (id) {
                    await updateDoc(doc(db, "productos", id), productoData);
                } else {
                    await addDoc(inventarioRef, productoData);
                }
                resetFormState();
            } catch (error) {
                alert("Error al guardar: " + error.message);
                statusDiv.style.backgroundColor = 'var(--danger)';
                statusDiv.textContent = 'Error de conexión';
            }
        };

        if (fotoFile) {
            procesarImagen(fotoFile, guardarDatos);
        } else {
            guardarDatos(null);
        }
    });

    // Borrar desde el formulario
    btnDelete.onclick = async () => {
        const id = document.getElementById('product-id').value;
        if (id && confirm('¿Estás seguro de eliminar este producto definitivamente de la base de datos?')) {
            statusDiv.textContent = 'Eliminando...';
            await deleteDoc(doc(db, "productos", id));
            resetFormState();
        }
    };

    // Eventos Tarjetas (+ y -)
    function asignarEventosTarjetas() {
        // Restar 1
        document.querySelectorAll('.btn-sold').forEach(btn => {
            btn.onclick = async (e) => {
                const id = e.target.dataset.id;
                const prod = currentProducts.find(p => p.id === id);
                if (prod.cantidad > 0) {
                    await updateDoc(doc(db, "productos", id), {
                        cantidad: prod.cantidad - 1,
                        fecha: serverTimestamp()
                    });
                } else {
                    alert('El producto ya está agotado.');
                }
            };
        });

        // Sumar 1
        document.querySelectorAll('.btn-add').forEach(btn => {
            btn.onclick = async (e) => {
                const id = e.target.dataset.id;
                const prod = currentProducts.find(p => p.id === id);
                await updateDoc(doc(db, "productos", id), {
                    cantidad: prod.cantidad + 1,
                    fecha: serverTimestamp()
                });
            };
        });
    }

    // Resetear Estado de Formulario
    btnCancel.onclick = resetFormState;

    function resetFormState() {
        form.reset();
        document.getElementById('product-id').value = '';
        document.getElementById('form-title').textContent = 'Agregar Nuevo Producto';
        
        btnSubmit.textContent = 'Guardar Nuevo Producto';
        btnSubmit.style.backgroundColor = 'var(--primary)';
        
        btnCancel.style.display = 'none';
        btnDelete.style.display = 'none';
        formActionsContainer.classList.remove('editing');
        
        editSelect.value = '';
    }
</script>
</body>
</html>
