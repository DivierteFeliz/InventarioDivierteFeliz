<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Divierte Feliz</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colores extraídos del logo */
            --logo-aqua: #46E2CB;
            --logo-pink: #FFC2D4;
            --logo-blue: #3F77C4;
            --logo-red: #EB3323;
            --logo-yellow: #FBE419;
            --logo-green: #5BB19B;
            
            --bg-color: #FAFAFC;
            --card-bg: #FFFFFF;
            --text-dark: #2D3748;
            --text-light: #718096;
        }

        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(70, 226, 203, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 194, 212, 0.2) 0%, transparent 20%),
                radial-gradient(circle at 80% 10%, rgba(251, 228, 25, 0.15) 0%, transparent 15%);
            background-attachment: fixed;
            color: var(--text-dark); 
            margin: 0; 
            padding: 20px; 
        }
        
        .container { max-width: 1200px; margin: 0 auto; }

        /* Cabecera amigable con Logo */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: var(--card-bg);
            padding: 15px 30px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            border-top: 6px solid var(--logo-aqua);
            border-bottom: 6px solid var(--logo-pink);
        }
        
        .app-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 50%;
        }

        h1 { color: var(--logo-blue); margin: 0; font-weight: 900; font-size: 2.2rem; text-align: center; }

        #connection-status {
            text-align: center;
            padding: 10px;
            background-color: var(--logo-yellow);
            color: var(--text-dark);
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Barra de Pestañas (Ventanas) */
        .tabs-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .tabs-container::-webkit-scrollbar { height: 8px; }
        .tabs-container::-webkit-scrollbar-thumb { background: #CBD5E0; border-radius: 10px; }

        .tab-btn {
            padding: 12px 25px;
            border-radius: 20px;
            border: 3px solid transparent;
            background: var(--card-bg);
            color: var(--logo-blue);
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tab-btn.active {
            background: var(--logo-aqua);
            color: var(--text-dark);
            border-color: var(--logo-green);
        }
        .tab-btn:hover { transform: translateY(-3px); }
        .tab-btn-add { background: var(--logo-pink); color: var(--text-dark); }
        
        .btn-delete-puesto {
            background: var(--logo-red);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Última actualización y Controles */
        .grid-header {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media(max-width: 768px) { .grid-header { grid-template-columns: 1fr; } }

        .update-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            border: 3px dashed var(--logo-aqua);
        }
        .update-container h3 { margin: 0 0 15px 0; font-size: 1.1rem; color: var(--logo-blue); text-align: center; }
        
        #last-update-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 1rem;
            color: var(--text-dark);
            font-weight: 700;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 5px;
        }
        #last-update-list div {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #E2E8F0;
            padding-bottom: 5px;
        }
        #last-update-list div:last-child { border-bottom: none; }
        .time-badge { color: var(--logo-blue); font-weight: 900; }

        .top-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            border-left: 6px solid var(--logo-yellow);
        }
        .control-group { display: flex; align-items: center; gap: 10px; }
        .control-group label { margin: 0; font-weight: bold; }
        .control-group select {
            padding: 10px 15px;
            border-radius: 12px;
            border: 2px solid #E2E8F0;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }

        /* Formulario */
        .form-container { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.04); 
            margin-bottom: 30px; 
            border-left: 6px solid var(--logo-green);
        }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .input-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: 700; font-size: 0.95rem; color: var(--text-dark); }
        input[type="text"], input[type="number"], input[type="file"] { 
            padding: 12px; 
            border: 2px solid #E2E8F0; 
            border-radius: 12px; 
            outline: none; 
            font-family: 'Nunito', sans-serif;
        }
        input:focus { border-color: var(--logo-blue); }
        
        /* Botones Generales */
        .btn { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 900; 
            font-size: 1rem;
            color: white; 
            transition: transform 0.1s, opacity 0.2s; 
            font-family: 'Nunito', sans-serif;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background-color: var(--logo-blue); margin-top: 15px; width: 100%; font-size: 1.1rem; }
        .btn-warning { background-color: var(--logo-yellow); color: var(--text-dark); }
        .btn-danger { background-color: var(--logo-red); }
        
        .form-actions-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
        .form-actions-grid.editing { grid-template-columns: 1fr 1fr 1fr; }

        /* Cuadrícula */
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .product-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
            display: flex; 
            flex-direction: column; 
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }
        .product-card:hover { transform: translateY(-5px); border-color: var(--logo-aqua); }
        .product-image { width: 100%; height: 220px; object-fit: cover; background-color: #F7FAFC; }
        .product-details { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-title { margin: 0 0 10px 0; font-size: 1.3rem; color: var(--logo-blue); font-weight: 900; }
        .product-info { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--text-light); font-size: 1.1rem;}
        .product-price { font-weight: 900; color: var(--logo-green); }
        
        /* Cajas de desglose de stock para la vista general */
        .stock-breakdown {
            background: #F7FAFC;
            padding: 10px;
            border-radius: 12px;
            border: 2px dashed #E2E8F0;
            font-size: 0.9rem;
            margin-bottom: 10px;
            max-height: 100px;
            overflow-y: auto;
        }
        .stock-breakdown div { margin-bottom: 4px; display: flex; justify-content: space-between; font-weight: 700;}

        /* Botones de las tarjetas */
        .product-actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .product-actions-main { display: grid; grid-template-columns: 3fr 1fr; gap: 12px; }
        .product-actions .btn { font-size: 1rem; padding: 12px; border-radius: 15px;}
        .product-actions .btn-sold { background-color: var(--logo-red); }
        .product-actions .btn-add { 
            background-color: var(--logo-green); 
            font-size: 1.8rem; 
            padding: 5px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .product-actions .btn-restock {
            background-color: var(--logo-aqua);
            color: var(--text-dark);
            padding: 10px;
            font-size: 0.95rem;
            border-radius: 12px;
        }
        
        .stock-zero { color: var(--logo-red); font-weight: 900; }
    </style>
</head>
<body>

<div class="container">
    <header class="app-header">
        <img src="logo.jpeg" alt="Logo Divierte Feliz" class="app-logo">
        <h1>Inventario Divierte Feliz</h1>
    </header>
    
    <div id="connection-status">Conectando...</div>

    <!-- Barra de Ventanas (Pestañas) -->
    <div class="tabs-container" id="tabs-container">
        <!-- Pestañas generadas por JavaScript -->
    </div>

    <!-- Panel de Control y Fecha -->
    <div class="grid-header">
        <div class="update-container">
            <h3>Últimas Modificaciones</h3>
            <div id="last-update-list">
                <!-- Horas por puesto inyectadas aquí -->
                <div style="color:var(--text-light); text-align:center; justify-content:center; border:none;">Cargando...</div>
            </div>
        </div>

        <div class="top-controls">
            <div class="control-group">
                <label for="sort-select">Ordenar por:</label>
                <select id="sort-select">
                    <option value="default">Seleccionar...</option>
                    <option value="precio">Precio (Agotados al final)</option>
                    <option value="stock-asc">Stock: Menor a Mayor</option>
                    <option value="stock-desc">Stock: Mayor a Menor</option>
                </select>
            </div>
            <div class="control-group">
                <label for="edit-select" style="color: var(--logo-blue);">✏️ Editar Producto:</label>
                <select id="edit-select">
                    <option value="">-- Seleccionar para editar --</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Formulario Global de Productos -->
    <div class="form-container">
        <h2 id="form-title">Agregar Nuevo Producto Global</h2>
        <p style="font-size: 0.9rem; color: var(--text-light); text-align: center; margin-top: -10px;">El producto aparecerá en todas las ventanas con stock 0.</p>
        
        <form id="product-form">
            <input type="hidden" id="product-id">
            <div class="form-grid">
                <div class="input-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="input-group">
                    <label>Precio de Venta Único ($)</label>
                    <input type="number" id="precio" required min="0" step="0.01">
                </div>
                <div class="input-group">
                    <label>Foto del Producto</label>
                    <input type="file" id="foto" accept="image/*">
                </div>
            </div>
            
            <div class="form-actions-grid" id="form-actions-container">
                <button type="submit" class="btn btn-primary" id="btn-submit">Guardar Producto</button>
                <button type="button" class="btn btn-warning" id="btn-cancel" style="display:none;">Cancelar Edición</button>
                <button type="button" class="btn btn-danger" id="btn-delete" style="display:none;">Borrar Producto</button>
            </div>
        </form>
    </div>

    <!-- Cuadrícula de Productos -->
    <div class="inventory-grid" id="inventory-grid"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBKkGH0Lna3ioSvkhbbSswXqTwxlfl3Usk",
        authDomain: "inventariodiviertefeliz-81f07.firebaseapp.com",
        projectId: "inventariodiviertefeliz-81f07",
        storageBucket: "inventariodiviertefeliz-81f07.firebasestorage.app",
        messagingSenderId: "133792051761",
        appId: "1:133792051761:web:766bdd9c6f8ddb56f01b10"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Referencias a Colecciones
    const productosRef = collection(db, "productos");
    const puestosRef = collection(db, "puestos");

    // Referencias del DOM
    const form = document.getElementById('product-form');
    const grid = document.getElementById('inventory-grid');
    const statusDiv = document.getElementById('connection-status');
    const tabsContainer = document.getElementById('tabs-container');
    const sortSelect = document.getElementById('sort-select');
    const editSelect = document.getElementById('edit-select');
    const updateListContainer = document.getElementById('last-update-list');
    
    const btnSubmit = document.getElementById('btn-submit');
    const btnCancel = document.getElementById('btn-cancel');
    const btnDelete = document.getElementById('btn-delete');
    const formActionsContainer = document.getElementById('form-actions-container');

    // Variables de Estado Global
    let currentProducts = [];
    let currentPuestos = [];
    let activeTab = 'general';
    let currentSort = 'default';

    // -----------------------------------------
    // 1. ESCUCHAR PUESTOS (VENTANAS Y TIEMPOS)
    // -----------------------------------------
    onSnapshot(puestosRef, (snapshot) => {
        currentPuestos = [];
        updateListContainer.innerHTML = '';

        snapshot.forEach(docSnap => {
            currentPuestos.push({ id: docSnap.id, ...docSnap.data() });
        });

        currentPuestos.sort((a, b) => a.nombre.localeCompare(b.nombre));

        if (currentPuestos.length === 0) {
            updateListContainer.innerHTML = '<div style="color:var(--text-light); text-align:center; justify-content:center; border:none;">Sin puestos creados</div>';
        } else {
            currentPuestos.forEach(p => {
                let timeString = "--:--";
                if (p.fecha_modificacion) {
                    const dateObj = new Date(p.fecha_modificacion.toMillis());
                    const hoy = new Date();
                    
                    const esHoy = dateObj.getDate() === hoy.getDate() && 
                                  dateObj.getMonth() === hoy.getMonth() && 
                                  dateObj.getFullYear() === hoy.getFullYear();
                    
                    const hora = dateObj.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
                    
                    if (esHoy) {
                        timeString = `Hoy, ${hora}`;
                    } else {
                        const fecha = dateObj.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit' });
                        timeString = `${fecha}, ${hora}`;
                    }
                }
                
                const item = document.createElement('div');
                item.innerHTML = `<span>🏪 ${p.nombre}:</span> <span class="time-badge">${timeString}</span>`;
                updateListContainer.appendChild(item);
            });
        }
        
        if (activeTab !== 'general' && !currentPuestos.find(p => p.id === activeTab)) {
            activeTab = 'general';
        }
        
        renderTabs();
        renderInventory();
    });

    // -----------------------------------------
    // 2. ESCUCHAR PRODUCTOS
    // -----------------------------------------
    onSnapshot(productosRef, (snapshot) => {
        statusDiv.style.backgroundColor = 'var(--logo-green)';
        statusDiv.style.color = 'white';
        statusDiv.textContent = '🟢 Conectado y Sincronizado';
        
        currentProducts = [];

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            currentProducts.push({ 
                id: docSnap.id, 
                ...data, 
                stock: data.stock || {}
            });
        });

        actualizarSelectorEdicion();
        renderInventory();
    });

    // -----------------------------------------
    // 3. RENDERIZAR PESTAÑAS (VENTANAS)
    // -----------------------------------------
    function renderTabs() {
        tabsContainer.innerHTML = '';

        const btnGen = document.createElement('button');
        btnGen.className = `tab-btn ${activeTab === 'general' ? 'active' : ''}`;
        btnGen.textContent = '📦 Stock General';
        btnGen.onclick = () => { activeTab = 'general'; renderTabs(); renderInventory(); };
        tabsContainer.appendChild(btnGen);

        currentPuestos.forEach(p => {
            const btnPuesto = document.createElement('button');
            btnPuesto.className = `tab-btn ${activeTab === p.id ? 'active' : ''}`;
            btnPuesto.textContent = `🏪 ${p.nombre}`;
            btnPuesto.onclick = () => { activeTab = p.id; renderTabs(); renderInventory(); };
            
            if (activeTab === p.id) {
                const delBtn = document.createElement('div');
                delBtn.className = 'btn-delete-puesto';
                delBtn.innerHTML = '✖';
                delBtn.title = "Eliminar este puesto";
                delBtn.onclick = async (e) => {
                    e.stopPropagation();
                    if (confirm(`¿Estás seguro de eliminar el puesto "${p.nombre}"? Sus registros de stock se perderán.`)) {
                        await deleteDoc(doc(db, "puestos", p.id));
                        activeTab = 'general';
                    }
                };
                btnPuesto.appendChild(delBtn);
            }

            tabsContainer.appendChild(btnPuesto);
        });

        const btnAdd = document.createElement('button');
        btnAdd.className = 'tab-btn tab-btn-add';
        btnAdd.textContent = '➕ Nuevo Puesto';
        btnAdd.onclick = async () => {
            const nombre = prompt('Ingresa el nombre del nuevo puesto:');
            if (nombre && nombre.trim() !== '') {
                await addDoc(puestosRef, { 
                    nombre: nombre.trim(), 
                    fecha_modificacion: serverTimestamp() 
                });
            }
        };
        tabsContainer.appendChild(btnAdd);
    }

    // -----------------------------------------
    // 4. RENDERIZAR INVENTARIO (CUADRÍCULA)
    // -----------------------------------------
    function renderInventory() {
        grid.innerHTML = '';
        let sortedProducts = [...currentProducts];

        sortedProducts.forEach(prod => {
            if (activeTab === 'general') {
                prod._displayStock = currentPuestos.reduce((total, p) => total + (prod.stock[p.id] || 0), 0);
            } else {
                prod._displayStock = prod.stock[activeTab] || 0;
            }
        });

        if (currentSort === 'precio') {
            sortedProducts.sort((a, b) => {
                if (a._displayStock === 0 && b._displayStock !== 0) return 1;
                if (b._displayStock === 0 && a._displayStock !== 0) return -1;
                return a.precio - b.precio; 
            });
        } else if (currentSort === 'stock-asc') {
            sortedProducts.sort((a, b) => a._displayStock - b._displayStock);
        } else if (currentSort === 'stock-desc') {
            sortedProducts.sort((a, b) => b._displayStock - a._displayStock);
        }

        sortedProducts.forEach((data) => {
            const stockDisplay = data._displayStock === 0 
                ? `<b class="stock-zero">Agotado (0)</b>` 
                : `<b>${data._displayStock}</b>`;

            const card = document.createElement('div');
            card.className = 'product-card';
            
            let cardHtml = `
                <img src="${data.foto || 'https://via.placeholder.com/250x200?text=Sin+Imagen'}" class="product-image">
                <div class="product-details">
                    <h3 class="product-title">${data.nombre}</h3>
                    <div class="product-info">
                        <span class="product-price">$${data.precio.toLocaleString('es-CL')}</span>
                        <span>Stock: ${stockDisplay}</span>
                    </div>`;

            if (activeTab === 'general') {
                cardHtml += `<div class="stock-breakdown">`;
                if (currentPuestos.length === 0) {
                    cardHtml += `<div style="color:var(--text-light);">Crea un puesto primero</div>`;
                } else {
                    currentPuestos.forEach(p => {
                        const s = data.stock[p.id] || 0;
                        cardHtml += `<div><span>${p.nombre}:</span> <span><b>${s}</b> unid.</span></div>`;
                    });
                }
                cardHtml += `</div></div>`;
            } else {
                cardHtml += `
                    <div class="product-actions">
                        <div class="product-actions-main">
                            <button class="btn btn-sold" data-id="${data.id}">- Vendido</button>
                            <button class="btn btn-add" data-id="${data.id}">+</button>
                        </div>
                        <button class="btn btn-restock" data-id="${data.id}">📦 Reponer Varios</button>
                    </div>
                </div>`;
            }

            card.innerHTML = cardHtml;
            grid.appendChild(card);
        });

        if (activeTab !== 'general') {
            asignarEventosTarjetas();
        }
    }

    // -----------------------------------------
    // 5. EVENTOS DE STOCK (+, - Vendido y Reponer)
    // -----------------------------------------
    function asignarEventosTarjetas() {
        // Restar 1 (Vendido)
        document.querySelectorAll('.btn-sold').forEach(btn => {
            btn.onclick = async (e) => {
                const id = e.target.dataset.id;
                const prod = currentProducts.find(p => p.id === id);
                const currentStock = prod.stock[activeTab] || 0;
                
                if (currentStock > 0) {
                    await updateDoc(doc(db, "productos", id), {
                        [`stock.${activeTab}`]: currentStock - 1
                    });
                    await updateDoc(doc(db, "puestos", activeTab), {
                        fecha_modificacion: serverTimestamp()
                    });
                } else {
                    alert('El producto ya está agotado en este puesto.');
                }
            };
        });

        // Sumar 1 (Agregar)
        document.querySelectorAll('.btn-add').forEach(btn => {
            btn.onclick = async (e) => {
                const id = e.target.dataset.id;
                const prod = currentProducts.find(p => p.id === id);
                const currentStock = prod.stock[activeTab] || 0;
                
                await updateDoc(doc(db, "productos", id), {
                    [`stock.${activeTab}`]: currentStock + 1
                });
                await updateDoc(doc(db, "puestos", activeTab), {
                    fecha_modificacion: serverTimestamp()
                });
            };
        });

        // Reponer Varios
        document.querySelectorAll('.btn-restock').forEach(btn => {
            btn.onclick = async (e) => {
                const id = e.target.dataset.id;
                const prod = currentProducts.find(p => p.id === id);
                const currentStock = prod.stock[activeTab] || 0;
                
                const input = prompt(`¿Cuántas unidades de "${prod.nombre}" quieres reponer?`);
                const qty = parseInt(input);
                
                if (!isNaN(qty) && qty > 0) {
                    await updateDoc(doc(db, "productos", id), {
                        [`stock.${activeTab}`]: currentStock + qty
                    });
                    await updateDoc(doc(db, "puestos", activeTab), {
                        fecha_modificacion: serverTimestamp()
                    });
                } else if (input !== null) {
                    alert('Por favor, ingresa un número válido mayor a 0.');
                }
            };
        });
    }

    // -----------------------------------------
    // 6. FORMULARIO Y EDICIÓN
    // -----------------------------------------
    sortSelect.addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderInventory();
    });

    editSelect.addEventListener('change', (e) => {
        const id = e.target.value;
        if (id) {
            iniciarEdicion(id);
        } else {
            resetFormState();
        }
    });

    function actualizarSelectorEdicion() {
        const currentValue = editSelect.value;
        editSelect.innerHTML = '<option value="">-- Seleccionar producto para editar --</option>';
        const listForSelect = [...currentProducts].sort((a, b) => a.nombre.localeCompare(b.nombre));
        
        listForSelect.forEach(prod => {
            const option = document.createElement('option');
            option.value = prod.id;
            option.textContent = prod.nombre;
            editSelect.appendChild(option);
        });

        if (currentProducts.find(p => p.id === currentValue)) {
            editSelect.value = currentValue;
        } else {
            resetFormState(); 
        }
    }

    function iniciarEdicion(id) {
        const prod = currentProducts.find(p => p.id === id);
        if (!prod) return;

        document.getElementById('product-id').value = id;
        document.getElementById('nombre').value = prod.nombre;
        document.getElementById('precio').value = prod.precio;
        
        document.getElementById('form-title').textContent = 'Modificando: ' + prod.nombre;
        btnSubmit.textContent = 'Actualizar Datos';
        
        btnCancel.style.display = 'block';
        btnDelete.style.display = 'block';
        formActionsContainer.classList.add('editing');
        editSelect.value = id; 
    }

    // Guardar (Crear o Editar Producto)
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusDiv.style.backgroundColor = 'var(--logo-yellow)';
        statusDiv.style.color = 'var(--text-dark)';
        statusDiv.textContent = 'Guardando en la nube...';

        const id = document.getElementById('product-id').value;
        const nombre = document.getElementById('nombre').value;
        const precio = parseFloat(document.getElementById('precio').value);
        const fotoFile = document.getElementById('foto').files[0];

        const guardarDatos = async (fotoData) => {
            const productoData = { nombre, precio };
            if (fotoData) productoData.foto = fotoData;

            try {
                if (id) {
                    await updateDoc(doc(db, "productos", id), productoData);
                } else {
                    productoData.stock = {}; 
                    await addDoc(productosRef, productoData);
                }
                resetFormState();
            } catch (error) {
                alert("Error al guardar: " + error.message);
                statusDiv.style.backgroundColor = 'var(--logo-red)';
                statusDiv.style.color = 'white';
                statusDiv.textContent = 'Error de conexión';
            }
        };

        if (fotoFile) {
            procesarImagen(fotoFile, guardarDatos);
        } else {
            guardarDatos(null);
        }
    });

    btnDelete.onclick = async () => {
        const id = document.getElementById('product-id').value;
        if (id && confirm('¿Estás seguro de eliminar este producto de TODO EL SISTEMA y todos los puestos?')) {
            statusDiv.textContent = 'Eliminando...';
            await deleteDoc(doc(db, "productos", id));
            resetFormState();
        }
    };

    btnCancel.onclick = resetFormState;

    function resetFormState() {
        form.reset();
        document.getElementById('product-id').value = '';
        document.getElementById('form-title').textContent = 'Agregar Nuevo Producto Global';
        btnSubmit.textContent = 'Guardar Nuevo Producto';
        
        btnCancel.style.display = 'none';
        btnDelete.style.display = 'none';
        formActionsContainer.classList.remove('editing');
        editSelect.value = '';
    }

    // Optimizador de Imagen
    function procesarImagen(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400;
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            }
            img.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
